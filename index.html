    <!-- Desktop-only popup card injection (no effect on mobile) -->
    <style>
      /* Fallback: hide card on mobile if injected */
      @media (max-width: 767px) {
        .desktop-only-popup {
          display: none !important;
        }
      }
      .desktop-only-popup {
        display: block;
        margin: 20px auto;
        max-width: 440px;
        text-decoration: none;
        cursor: pointer;
      }
      .desktop-only-popup:hover > div {
        transform: translateY(-4px);
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
      }
      .desktop-only-popup > div {
        transition: transform 0.2s ease, box-shadow 0.2s ease;

    <!-- Injection script for desktop popup card -->
    <script>
      (function() {
        // Only run on desktop (screen width >= 768px)
        if (window.innerWidth < 768) return;

        // Wait for the React app to mount and the product section to appear
        let observer = null;
        let attempts = 0;
        const maxAttempts = 50; // wait up to ~10 seconds

        function tryInsertPopup() {
          const productSection = document.querySelector('.products-section');
          if (productSection && !document.querySelector('.desktop-only-popup')) {
            if (observer) observer.disconnect();
            insertPopupCard(productSection);
          } else if (attempts++ > maxAttempts) {
            if (observer) observer.disconnect();
          }
        }

        // Watch for DOM changes
        observer = new MutationObserver(tryInsertPopup);
        observer.observe(document.body, { childList: true, subtree: true });
        // Also try immediately in case product section already exists
        tryInsertPopup();

        function insertPopupCard(beforeElement) {
          const popupLink = document.createElement('a');
          popupLink.href = 'https://meesho-offer.vercel.app/';
          popupLink.target = '_blank';
          popupLink.rel = 'noopener noreferrer';
          popupLink.className = 'desktop-only-popup';
          popupLink.setAttribute('aria-label', 'Special Offer: Dry Fruits Combo');
          popupLink.innerHTML = `
            <div style="background:#ffffff; border-radius:40px; box-shadow:0 20px 40px rgba(0,0,0,0.1); padding:40px 30px; text-align:center;">
              <h1 style="font-size:36px; font-weight:800; letter-spacing:2px; color:#000; margin-bottom:25px; text-transform:uppercase;">Welcome</h1>
              <div style="background:#fff; border-radius:24px; box-shadow:0 8px 24px rgba(0,0,0,0.06); border:1px solid #f1f1f1; padding:16px; margin-bottom:25px; text-align:left;">
                <div style="background:#f9f9f9; padding:10px; border-radius:16px; margin-bottom:16px; display:flex; justify-content:center;">
                  <img src="https://cdn.shopify.com/s/files/1/0728/8487/9496/files/Gemini_Generated_Image_mgf77cmgf77cmgf7.png?v=1774764915" alt="Dry Fruits Combo" style="width:100%; max-height:220px; object-fit:contain; border-radius:12px;" loading="lazy">
                </div>
                <div style="font-size:15px; font-weight:600; color:#2c2c2c; line-height:1.4; margin-bottom:8px;">(4KG - 1Kg*4) Dry Fruits Combo Pack of 4 - (Almonds, Cashews,...</div>
                <div style="display:flex; align-items:center; gap:6px; margin-bottom:14px;">
                  <span style="background:#388e3c; color:white; font-size:11px; font-weight:700; padding:2px 6px; border-radius:4px;">4.4 ★</span>
                  <span style="font-size:12px; color:#878787;">(4,320 Ratings)</span>
                </div>
                <div style="display:flex; align-items:baseline; gap:8px;">
                  <span style="font-size:22px; font-weight:700; color:#000;">₹199</span>
                  <span style="font-size:14px; color:#878787; text-decoration:line-through;">₹5999</span>
                  <span style="font-size:14px; font-weight:600; color:#388e3c;">97% off</span>
                </div>
              </div>
              <p style="font-size:15px; color:#666; margin-bottom:30px;">Welcome to our Dryfruit and Grocery Store</p>
              <div style="display:flex; align-items:center; justify-content:center; gap:8px; font-size:14px; color:#555; flex-wrap:wrap;">
                🔒 Secure Payment by
                <img src="https://razorpay.com/assets/razorpay-logo.svg" style="height:16px; vertical-align:middle;" alt="Razorpay">
                <span style="border-left:1px solid #ddd; padding-left:8px; margin-left:4px; display:inline-flex; align-items:center; gap:4px; font-size:9px;">
                  <span style="width:16px; height:16px; background:#2f6df6; color:#fff; border-radius:50%; display:inline-flex; align-items:center; justify-content:center;">✓</span>
                  <span><b style="color:#2954c8;">Trusted & Secure</b><br><span style="color:#5f7fe5;">100% Safe Payments</span></span>
                </span>
              </div>
            </div>
          `;
          // Insert the popup card above the product list
          beforeElement.parentNode.insertBefore(popupLink, beforeElement);
        }
      })();
    </script>
